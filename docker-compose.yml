# The complete PulseOps stack for local evaluation.
#
#   docker compose up --build
#
# Web UI        http://localhost:3000   (demo@northwind.example / pulseops-demo-2026)
# Mail catcher  http://localhost:8025   (every notification email lands here)
#
# The `demo-targets` service and SEED_DEMO make this a demo. For production,
# see docs/deployment.md: remove both, and set real secrets and APP_URL.

x-app-env: &app-env
  NODE_ENV: production
  APP_URL: ${APP_URL:-http://localhost:3000}
  DATABASE_URL: postgresql://pulseops:${POSTGRES_PASSWORD:-pulseops}@postgres:5432/pulseops
  REDIS_URL: redis://redis:6379
  SMTP_URL: ${SMTP_URL:-smtp://mailpit:1025}
  EMAIL_FROM: ${EMAIL_FROM:-PulseOps <alerts@pulseops.localhost>}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  # Demo only: lets monitors reach the bundled simulator on the private Docker network.
  MONITOR_ALLOWED_PRIVATE_HOSTS: ${MONITOR_ALLOWED_PRIVATE_HOSTS:-demo-targets:4010}
  DEMO_TARGETS_URL: http://demo-targets:4010
  AI_PROVIDER: ${AI_PROVIDER:-none}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pulseops
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pulseops}
      POSTGRES_DB: pulseops
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulseops -d pulseops"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    # Queues must never be evicted; see docs/deployment.md.
    command: ["redis-server", "--maxmemory-policy", "noeviction", "--appendonly", "yes"]
    volumes: [redis-data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:latest
    ports: ["8025:8025"]

  # One-shot: applies migrations, then loads the demo workspace (if SEED_DEMO=true and it is not there yet).
  migrate:
    build: { context: ., target: worker }
    environment:
      <<: *app-env
      SEED_DEMO: ${SEED_DEMO:-true}
      ALLOW_DEMO_SEED: "true"
    command: ["sh", "-c", "npx prisma migrate deploy && if [ \"$$SEED_DEMO\" = \"true\" ]; then node dist/seed.mjs --if-empty; fi"]
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  web:
    build: { context: ., target: web, args: { APP_URL: "${APP_URL:-http://localhost:3000}" } }
    environment: *app-env
    ports: ["3000:3000"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    restart: unless-stopped

  # Runs continuously and independently of the web app. Scale with `--scale worker=N`.
  worker:
    build: { context: ., target: worker }
    environment:
      <<: *app-env
      WORKER_HEALTH_PORT: "4001"
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4001/healthz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  demo-targets:
    build: { context: ., target: worker }
    command: ["node", "dist/demo-targets.mjs"]
    environment: { DEMO_CONTROL_OPEN: "true" }
    # Published on loopback only, so `npm run demo:ctl` on the host can break and heal services.
    ports: ["127.0.0.1:4010:4010"]
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
