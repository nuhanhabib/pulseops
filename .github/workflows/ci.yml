name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgresql://pulseops:pulseops@localhost:5432/pulseops
  TEST_DATABASE_URL: postgresql://pulseops:pulseops@localhost:5432/pulseops_test
  REDIS_URL: redis://localhost:6379
  APP_URL: http://localhost:3100
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pulseops
          POSTGRES_PASSWORD: pulseops
          POSTGRES_DB: pulseops
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pulseops" --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Create the test database
        run: PGPASSWORD=pulseops psql -h localhost -U pulseops -d pulseops -c 'CREATE DATABASE pulseops_test'
      - run: npm run lint
      - run: npm run typecheck
      - name: Unit, integration, and component tests
        run: npm test
      - run: npm run build
      - run: npm run build:worker
      - name: Dependency audit (production dependencies)
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true
      - name: End-to-end tests
        run: |
          npx prisma migrate deploy
          npm run db:seed
          npx playwright install --with-deps chromium
          npm run test:e2e
        env:
          MONITOR_ALLOWED_PRIVATE_HOSTS: localhost:4010
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
